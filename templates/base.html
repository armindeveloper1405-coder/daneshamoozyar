{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="en-US">

<head>
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/menu.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'js/fancybox/jquery.fancybox-1.3.4.css' %}" media="screen" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/isotope.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/portfolio.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap-responsive.min.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/custom_responsive.css' %}" />
    <link rel='stylesheet' type='text/css' href='https://fonts.googleapis.com/css?family=Roboto+Condensed' />
    <link rel="stylesheet" type="text/css" href="{% static 'css/skin.css' %}" />

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>

<body>

    <!-- Nav Start -->
    <header>
        <article class="container">
            <div class="row">
                <div class="span12">
                    <nav>
                        <ul>
                            <li><a href="{% url 'index' %}" title="home">صفحه اصلی</a></li>
                            <li><a href="#services" title="services">خدمات</a></li>
                            <li><a href="#about" title="about">درباره ما</a></li>
                            <li><a href="#portfolio" title="portfolio">نمونه کارها</a></li>
                            <li><a href="#contact" title="contact">تماس با ما</a></li>
                            <li><a href="{% url 'blog' %}" title="blog">بلاگ</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </article>
    </header>

    {% block content %}

    {% endblock %}

    <!-- Contact Start -->
    <section id="contact" class="page">
        <article class="container">
            <div class="row">
                <div class="span12">
                    <div class="sub_header">
                        <h2>تماس با ما</h2>
                        <h3>شما میتوانید با استفاده از اطلاعات پایینی با ما در ارتباط باشید!!!</h3>
                    </div>
                </div>

                <div class="contact_form">
                    <form method="post" action="" name="contact-form" id="contact-form">
                        {% csrf_token %}
                        <div id="main">
                            <div id="response"></div>
                            <div class="span4">
                                <label>نام:</label>
                                <p><input type="text" name="name" id="name" size="30" /></p>
                            </div>
                            <div class="span4">
                                <label>ایمیل:</label>
                                <p><input type="text" name="email" id="email" size="30" /></p>
                            </div>
                            <div class="span4">
                                <label>موضوع:</label>
                                <p><input type="text" name="subject" id="subject" size="30" /></p>
                            </div>
                            <div class="span12">
                                <label>پیام:</label>
                                <p><textarea name="message" id="message" cols="30" rows="10"></textarea></p>
                                <p><input class="contact_button button" type="submit" name="submit" id="submit" value="ارسال پیام" /></p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </article>
    </section>
    <!-- Contact End -->

    <!-- اسکریپت‌ها با ترتیب صحیح و بدون خطا -->
    <script type="text/javascript" src="{% static 'js/jquery.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/bootstrap.min.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/fancybox/jquery.fancybox-1.3.4.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/jquery.scrollTo.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/jquery.nav.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/jquery.isotope.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/contact.js' %}"></script>
    <script type="text/javascript" src="{% static 'js/custom.js' %}"></script>
</body>

</html>
